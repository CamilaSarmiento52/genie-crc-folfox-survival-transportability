[project]
name = "crc-folfox"
version = "0.1.0"
description = "Exploratory feasibility analysis for the GENIE BPC CRC FOLFOX survival research question"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7,<8",
    "jupyterlab>=4.4,<5",
    "lifelines==0.30.3",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "python-docx>=1.1,<2",
    "scikit-learn>=1.9,<2",
    "scipy>=1.15,<2",
    "seaborn>=0.13,<1",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "jupytext>=1.17,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crc_folfox.features" = ["feature_manifest.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "analysis/out",
    "crc_data",
]

[tool.ruff.format]
exclude = ["EDA.ipynb"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.pytest.ini_options]
# `-m "not restricted_data"` makes the default suite fast and, more importantly, makes the
# restricted-data suite an explicit choice. Those tests exercise real workflows against the
# gitignored release and were the mechanism behind the cross-phase overwrite risk disclosed in
# Phases 5A/6/7. Run them deliberately: `uv run pytest -m restricted_data`.
addopts = "-ra -m 'not restricted_data'"
testpaths = ["tests"]
markers = [
    "restricted_data: tests requiring the local restricted GENIE BPC CRC release",
    "slow: tests that exercise a full structural inventory and take longer to run",
]
